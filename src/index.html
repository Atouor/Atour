<!doctype html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>Atour</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Atour — Portfolio of Alireza Hosein Aghaie, Kudos project manager and hands-on product developer.">
  <meta name="theme-color" content="#080808">
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
  <link rel="icon" type="image/x-icon" href="favicon.ico?v=2">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400..700&family=Vazirmatn:wght@400..800&display=swap" rel="stylesheet">
  <script>
    (function() {
      var t = localStorage.getItem('atour-theme');
      if (t) document.documentElement.setAttribute('data-theme', t);
      var l = localStorage.getItem('atour-lang-v2');
      if (l === 'fa') {
        document.documentElement.setAttribute('lang', 'fa');
        document.documentElement.setAttribute('dir', 'rtl');
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
